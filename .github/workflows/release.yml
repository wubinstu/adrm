name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Test
        run: go test ./...
      - name: Integration tests
        run: |
          go build -o adrm .
          bash tests/integration.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: adrm-linux-x86_64
          - goos: linux
            goarch: arm64
            artifact: adrm-linux-arm64
          - goos: darwin
            goarch: amd64
            artifact: adrm-macos-x86_64
          - goos: darwin
            goarch: arm64
            artifact: adrm-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build (static, CGO off)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags="-s -w -X github.com/wubinstu/adrm/internal/cli.version=${GITHUB_REF_NAME#v}" \
            -o dist/${{ matrix.artifact }} .
      - name: Checksum
        run: |
          cd dist
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum adrm-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## adrm $TAG"
            echo
            echo "A safer rm: everything you delete goes to a trash bin and can be listed, restored or purged later."
            echo "One static binary, no daemon. See README.md for the full documentation."
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/wubinstu/adrm/main/install.sh | bash"
            echo '```'
          } > NOTES.md
          gh release create "$TAG" dist/* install.sh --title "adrm $TAG" --notes-file NOTES.md
